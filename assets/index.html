<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visión Artificial - Clasificador</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Clasificador de IA</h1>
            <p>Modelo Edge Impulse en Arduino</p>
        </header>
        
        <main>
            <div class="video-container">
                <iframe src="http://localhost:4912/embed" width="100%" height="480" frameborder="0" style="background: black; border-radius: 8px;"></iframe>
            </div>
            
            <div class="controls">
                <label for="threshold">Umbral de Confianza (Threshold): <span id="th-value">0.50</span></label>
                <input type="range" id="threshold" min="0.1" max="1.0" step="0.01" value="0.5">
            </div>

            <div class="detections">
                <h2>Última Detección</h2>
                <div id="detection-log" class="log-box">
                    Esperando a que la cámara detecte algo...
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
